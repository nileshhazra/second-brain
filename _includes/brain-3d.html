<!-- Advanced Interactive 3D Visualizer & Model Explorer Stage -->
<div class="stage-3d-wrapper">
  <!-- Top Stage Header -->
  <div class="stage-3d-header">
    <div class="stage-tab-group">
      <button class="stage-tab active" id="tab-webgl-visuals" data-target="panel-webgl-visuals" aria-label="3D Procedural Visuals">
        <span class="tab-icon">✨</span>
        <span class="tab-text">3D Visualizers</span>
        <span class="live-pulse-badge">WebGL</span>
      </button>
      <button class="stage-tab" id="tab-model-viewer" data-target="panel-model-viewer" aria-label="3D Model Viewer">
        <span class="tab-icon">📦</span>
        <span class="tab-text">3D Model Explorer</span>
      </button>
    </div>

    <!-- HUD Action Controls for WebGL -->
    <div class="stage-hud-controls" id="neural-hud-controls">
      <button class="hud-btn" id="btn-pulse-brain" title="Trigger Energy Burst (or press 'P')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
        <span>Energy Burst</span>
      </button>
      <button class="hud-btn active" id="btn-rotate-brain" title="Toggle Auto-Orbit">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
        </svg>
        <span>Auto Orbit</span>
      </button>
      <button class="hud-btn hud-btn-icon" id="btn-reset-brain" title="Reset View">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- Panel 1: Three.js Interactive WebGL Visualizers -->
  <div class="stage-panel active" id="panel-webgl-visuals">
    <!-- Sub-navigation: Visual Mode Switcher -->
    <div class="visual-modes-toolbar">
      <div class="visual-modes-group">
        <button class="visual-mode-pill active" data-mode="neural">
          <span>🧠</span> Neural Brain
        </button>
        <button class="visual-mode-pill" data-mode="constellation">
          <span>🌐</span> Knowledge Graph
        </button>
        <button class="visual-mode-pill" data-mode="helix">
          <span>🧬</span> Data Stream Helix
        </button>
      </div>
    </div>

    <!-- 3D Canvas -->
    <div id="brain-3d-canvas-container" class="brain-3d-canvas-container" title="Drag to inspect 360°, double-click to trigger burst">
      <div class="brain-loading-spinner">
        <div class="spinner-ring"></div>
        <span>Initializing WebGL 3D Matrix...</span>
      </div>
    </div>

    <!-- Live Status Footer -->
    <div class="stage-badge-bar">
      <div id="stage-badge-description" class="stage-badge-description">
        <span class="badge-item"><span class="badge-dot pulse"></span> 380 Synapses</span>
        <span class="badge-item">⚡ 720+ Axons</span>
      </div>
      <span class="badge-item hide-mobile">🖱️ Drag to rotate 360° · 👆 Double-click to surge</span>
    </div>
  </div>

  <!-- Panel 2: Google <model-viewer> 3D Model Explorer with Model Switcher -->
  <div class="stage-panel" id="panel-model-viewer">
    <!-- Model Switcher Toolbar -->
    <div class="visual-modes-toolbar">
      <div class="visual-modes-group">
        <button class="model-select-pill active" data-model="https://modelviewer.dev/shared-assets/models/Astronaut.glb" data-name="Astronaut Explorer">
          <span>🚀</span> Astronaut
        </button>
        <button class="model-select-pill" data-model="https://modelviewer.dev/shared-assets/models/RobotExpressive.glb" data-name="Autonomous Robot">
          <span>🤖</span> Autonomous Bot
        </button>
        <button class="model-select-pill" data-model="https://modelviewer.dev/shared-assets/models/shishkebab.glb" data-name="Organic Artifact">
          <span>🍢</span> Artifact
        </button>
      </div>
    </div>

    <div class="model-viewer-wrapper">
      <model-viewer
        id="sample-model-viewer"
        src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
        alt="Interactive 3D Model"
        auto-rotate
        camera-controls
        touch-action="pan-y"
        shadow-intensity="1.5"
        shadow-softness="0.8"
        exposure="1"
        loading="lazy"
        ar
        ar-modes="webxr scene-viewer quick-look">
        <div slot="progress-bar" class="model-progress-bar">
          <div class="update-bar"></div>
        </div>
      </model-viewer>

      <div class="model-controls-strip">
        <div class="model-caption">
          <strong id="active-model-name">Astronaut Explorer</strong>
          <span>Orbit 360°, zoom with scroll/pinch, or inspect in AR</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // Tab & Model Switcher logic
  (function() {
    const tabs = document.querySelectorAll('.stage-tab');
    const panels = document.querySelectorAll('.stage-panel');
    const hud = document.getElementById('neural-hud-controls');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const targetId = tab.dataset.target;
        tabs.forEach(t => t.classList.remove('active'));
        panels.forEach(p => p.classList.remove('active'));

        tab.classList.add('active');
        const targetPanel = document.getElementById(targetId);
        if (targetPanel) targetPanel.classList.add('active');

        if (hud) {
          hud.style.display = targetId === 'panel-webgl-visuals' ? 'flex' : 'none';
        }

        if (window.SecondBrainAudio) {
          window.SecondBrainAudio.playClick();
        }
      });
    });

    // 3D Model Switcher buttons
    const modelPills = document.querySelectorAll('.model-select-pill');
    const viewer = document.getElementById('sample-model-viewer');
    const nameLabel = document.getElementById('active-model-name');

    modelPills.forEach(pill => {
      pill.addEventListener('click', () => {
        modelPills.forEach(p => p.classList.remove('active'));
        pill.classList.add('active');

        const modelUrl = pill.dataset.model;
        const modelName = pill.dataset.name;

        if (viewer && modelUrl) {
          viewer.src = modelUrl;
        }
        if (nameLabel && modelName) {
          nameLabel.textContent = modelName;
        }

        if (window.SecondBrainAudio) {
          window.SecondBrainAudio.playClick();
        }
      });
    });
  })();
</script>
