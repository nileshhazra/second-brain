<!-- Interactive 3D Brain & 3D Model Stage -->
<div class="stage-3d-wrapper">
  <div class="stage-3d-header">
    <div class="stage-tab-group">
      <button class="stage-tab active" id="tab-neural-brain" data-target="panel-neural-brain" aria-label="Neural Brain 3D">
        <span class="tab-icon">🧠</span>
        <span class="tab-text">Neural Network</span>
        <span class="live-pulse-badge">LIVE 3D</span>
      </button>
      <button class="stage-tab" id="tab-model-viewer" data-target="panel-model-viewer" aria-label="3D Model Viewer">
        <span class="tab-icon">📦</span>
        <span class="tab-text">3D Model Viewer</span>
      </button>
    </div>

    <!-- HUD Action Controls -->
    <div class="stage-hud-controls" id="neural-hud-controls">
      <button class="hud-btn" id="btn-pulse-brain" title="Fire Synaptic Pulse (or press 'P')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
        <span>Fire Synapse</span>
      </button>
      <button class="hud-btn active" id="btn-rotate-brain" title="Toggle Auto-Orbit">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
        </svg>
        <span>Auto Orbit</span>
      </button>
      <button class="hud-btn hud-btn-icon" id="btn-reset-brain" title="Reset View">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- Panel 1: Three.js WebGL Neural Brain Canvas -->
  <div class="stage-panel active" id="panel-neural-brain">
    <div id="brain-3d-canvas-container" class="brain-3d-canvas-container" title="Drag to rotate, double click to fire pulse">
      <div class="brain-loading-spinner">
        <div class="spinner-ring"></div>
        <span>Constructing Neural Synapses...</span>
      </div>
    </div>
    <div class="stage-badge-bar">
      <span class="badge-item"><span class="badge-dot pulse"></span> 380 Synaptic Nodes</span>
      <span class="badge-item">⚡ 720+ Axon Pathways</span>
      <span class="badge-item hide-mobile">🖱️ Drag to rotate · 👆 Double-click to surge</span>
    </div>
  </div>

  <!-- Panel 2: Google <model-viewer> 3D Model Explorer -->
  <div class="stage-panel" id="panel-model-viewer">
    <div class="model-viewer-wrapper">
      <model-viewer
        id="sample-model-viewer"
        src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
        alt="Interactive 3D Model"
        auto-rotate
        camera-controls
        touch-action="pan-y"
        shadow-intensity="1.5"
        shadow-softness="0.8"
        exposure="1"
        loading="lazy"
        ar
        ar-modes="webxr scene-viewer quick-look">
        <div slot="progress-bar" class="model-progress-bar">
          <div class="update-bar"></div>
        </div>
      </model-viewer>
      <div class="model-controls-strip">
        <div class="model-caption">
          <strong>Interactive 3D Model Viewer</strong>
          <span>Orbit 360°, zoom with scroll/pinch, or view in AR</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // Tab switcher for 3D stage
  (function() {
    const tabs = document.querySelectorAll('.stage-tab');
    const panels = document.querySelectorAll('.stage-panel');
    const hud = document.getElementById('neural-hud-controls');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const targetId = tab.dataset.target;
        tabs.forEach(t => t.classList.remove('active'));
        panels.forEach(p => p.classList.remove('active'));

        tab.classList.add('active');
        const targetPanel = document.getElementById(targetId);
        if (targetPanel) targetPanel.classList.add('active');

        if (hud) {
          hud.style.display = targetId === 'panel-neural-brain' ? 'flex' : 'none';
        }

        if (window.SecondBrainAudio) {
          window.SecondBrainAudio.playClick();
        }
      });
    });
  })();
</script>
